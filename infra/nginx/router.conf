# ENH-INFRA-006 — Blue-Green Traffic Router
#
# The active slot is determined by reading /etc/nginx/active/slot.
# Default: blue.  Swap by running scripts/blue-green-swap.sh promote-green
# then reloading nginx: docker exec stylenest-router nginx -s reload
#
# Slot-switch is zero-downtime: nginx reloads without dropping existing
# connections (graceful worker replacement).

# Shared map — reads active slot from file written by swap script
map $uri $active_upstream {
    default "blue_gateway";
}

server {
    listen 80;
    server_name _;

    # Proxy to whichever slot is currently active.
    # The swap script writes the upstream name to /etc/nginx/active/upstream.
    # On nginx reload the include is re-evaluated.
    include /etc/nginx/active/upstream.conf;

    location / {
        proxy_pass         http://$active_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Slot identity header — visible in response for canary verification
        add_header         X-Active-Slot     $active_upstream always;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Health endpoint for the router itself (not proxied)
    location = /router-health {
        access_log  off;
        return 200  "router-ok\n";
        add_header  Content-Type text/plain;
    }
}

server {
    listen 8080;
    server_name _;

    # nginx stub status — polled by monitor script
    location = /nginx-health {
        access_log  off;
        return 200  "ok\n";
        add_header  Content-Type text/plain;
    }

    location = /nginx-status {
        stub_status;
        access_log  off;
    }
}
