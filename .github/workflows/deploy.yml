name: Deploy to Azure

on:
  push:
    branches: [main]

env:
  DOTNET_VERSION: "10.0.x"
  NODE_VERSION: "22.x"
  ACR_REGISTRY: ${{ secrets.ACR_REGISTRY }}         # e.g. stylenestacr.azurecr.io
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
  ACA_ENVIRONMENT: ${{ secrets.ACA_ENVIRONMENT }}

jobs:
  # ─────────────────────────────────────────────────────────
  # Build and push Docker images to Azure Container Registry
  # ─────────────────────────────────────────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest

    strategy:
      matrix:
        service:
          - { name: auth-api,     dockerfile: backend/src/Services/StyleNest.Auth.API/Dockerfile }
          - { name: user-api,     dockerfile: backend/src/Services/StyleNest.User.API/Dockerfile }
          - { name: catalog-api,  dockerfile: backend/src/Services/StyleNest.Catalog.API/Dockerfile }
          - { name: cart-api,     dockerfile: backend/src/Services/StyleNest.Cart.API/Dockerfile }
          - { name: order-api,    dockerfile: backend/src/Services/StyleNest.Order.API/Dockerfile }
          - { name: admin-api,    dockerfile: backend/src/Services/StyleNest.Admin.API/Dockerfile }
          - { name: seller-api,   dockerfile: backend/src/Services/StyleNest.Seller.API/Dockerfile }
          - { name: gateway-api,  dockerfile: backend/src/Services/StyleNest.Gateway.API/Dockerfile }
          - { name: media-api,    dockerfile: backend/src/Services/StyleNest.Media.API/Dockerfile }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to Azure Container Registry
        run: az acr login --name ${{ env.ACR_REGISTRY }}

      - name: Build & push — ${{ matrix.service.name }}
        run: |
          IMAGE=${{ env.ACR_REGISTRY }}/stylenest/${{ matrix.service.name }}:${{ github.sha }}
          docker build \
            --file ${{ matrix.service.dockerfile }} \
            --tag $IMAGE \
            ./backend
          docker push $IMAGE

  # ─────────────────────────────────────────────────────────
  # Build and deploy Angular storefronts to Azure Static Web Apps
  # ─────────────────────────────────────────────────────────
  deploy-user-panel:
    name: Deploy User Panel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: user-panel/package-lock.json

      - name: Install & build
        working-directory: user-panel
        run: |
          npm ci
          npx ng build --configuration production

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_STOREFRONT_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: user-panel/dist/user-panel/browser
          skip_app_build: true

  deploy-admin:
    name: Deploy Admin Panel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json

      - name: Install & build
        working-directory: admin-panel
        run: |
          npm ci
          npx ng build --configuration production

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_ADMIN_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: admin-panel/dist/admin-panel/browser
          skip_app_build: true

  # ─────────────────────────────────────────────────────────
  # Deploy backend containers to Azure Container Apps
  # ─────────────────────────────────────────────────────────
  deploy-backend:
    name: Deploy Backend Services
    runs-on: ubuntu-latest
    needs: build-and-push

    strategy:
      matrix:
        service:
          - auth-api
          - user-api
          - catalog-api
          - cart-api
          - order-api
          - admin-api
          - seller-api
          - gateway-api
          - media-api

    steps:
      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Update Container App — ${{ matrix.service }}
        run: |
          az containerapp update \
            --name stylenest-${{ matrix.service }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_REGISTRY }}/stylenest/${{ matrix.service }}:${{ github.sha }}
