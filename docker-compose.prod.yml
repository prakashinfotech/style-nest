# ============================================================
# StyleNest E-Commerce — Production Stack for Azure VM
# Usage: docker compose -f docker-compose.prod.yml up -d --build
# ============================================================

services:

  # ----------------------------------------------------------
  # SQL Server 2022
  # ----------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: stylenest-sqlserver
    restart: always
    environment:
      MSSQL_SA_PASSWORD: ${SQLSERVER_SA_PASSWORD}
      ACCEPT_EULA: "Y"
      MSSQL_PID: Standard
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -b -No"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    networks:
      - stylenest-net

  # ----------------------------------------------------------
  # Redis 7 (Cache)
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: stylenest-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - stylenest-net

  # ----------------------------------------------------------
  # Auth.API
  # ----------------------------------------------------------
  auth-api:
    build:
      context: ./backend
      dockerfile: src/Services/StyleNest.Auth.API/Dockerfile
    container_name: stylenest-auth-api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=StyleNestDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Command Timeout=300"
      AllowedOrigins__0: "https://style-nest.prakashsoftwares.com"
      AllowedOrigins__1: "http://style-nest.prakashsoftwares.com"
      AllowedOrigins__2: "https://style-nest-api.prakashsoftwares.com"
      AllowedOrigins__3: "http://style-nest-api.prakashsoftwares.com"
      Jwt__PrivateKeyPath: "/app/keys/private.pem"
      Jwt__PublicKeyPath: "/app/keys/public.pem"
      Jwt__Issuer: "${Jwt__Issuer:-https://stylenest-auth.local}"
      Jwt__Audience: "${Jwt__Audience:-stylenest-spa}"
      OtpDelivery__Provider: "Logging"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - stylenest-net

  # ----------------------------------------------------------
  # User.API
  # ----------------------------------------------------------
  user-api:
    build:
      context: ./backend
      dockerfile: src/Services/StyleNest.User.API/Dockerfile
    container_name: stylenest-user-api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=StyleNestDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Command Timeout=300"
      AllowedOrigins__0: "https://style-nest.prakashsoftwares.com"
      AllowedOrigins__1: "http://style-nest.prakashsoftwares.com"
      AllowedOrigins__2: "https://style-nest-api.prakashsoftwares.com"
      Jwt__PublicKeyPath: "/app/keys/public.pem"
      Jwt__Issuer: "${Jwt__Issuer:-https://stylenest-auth.local}"
      Jwt__Audience: "${Jwt__Audience:-stylenest-spa}"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - stylenest-net

  # ----------------------------------------------------------
  # Catalog.API
  # ----------------------------------------------------------
  catalog-api:
    build:
      context: ./backend
      dockerfile: src/Services/StyleNest.Catalog.API/Dockerfile
    container_name: stylenest-catalog-api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=StyleNestDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Command Timeout=300"
      ConnectionStrings__Redis: "redis:6379"
      AllowedOrigins__0: "https://style-nest.prakashsoftwares.com"
      AllowedOrigins__1: "http://style-nest.prakashsoftwares.com"
      AllowedOrigins__2: "https://style-nest-api.prakashsoftwares.com"
      Jwt__PublicKeyPath: "/app/keys/public.pem"
      Jwt__Issuer: "${Jwt__Issuer:-https://stylenest-auth.local}"
      Jwt__Audience: "${Jwt__Audience:-stylenest-spa}"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - stylenest-net

  # ----------------------------------------------------------
  # Cart.API
  # ----------------------------------------------------------
  cart-api:
    build:
      context: ./backend
      dockerfile: src/Services/StyleNest.Cart.API/Dockerfile
    container_name: stylenest-cart-api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=StyleNestDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Command Timeout=300"
      AllowedOrigins__0: "https://style-nest.prakashsoftwares.com"
      AllowedOrigins__1: "http://style-nest.prakashsoftwares.com"
      AllowedOrigins__2: "https://style-nest-api.prakashsoftwares.com"
      Jwt__PublicKeyPath: "/app/keys/public.pem"
      Jwt__Issuer: "${Jwt__Issuer:-https://stylenest-auth.local}"
      Jwt__Audience: "${Jwt__Audience:-stylenest-spa}"
    volumes:
      - ./keys:/app/keys:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    networks:
      - stylenest-net

  # ----------------------------------------------------------
  # Order.API
  # ----------------------------------------------------------
  order-api:
    build:
      context: ./backend
      dockerfile: src/Services/StyleNest.Order.API/Dockerfile
    container_name: stylenest-order-api
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:80
      ConnectionStrings__DefaultConnection: "Server=sqlserver,1433;Database=StyleNestDb;User Id=sa;Password=${SQLSERVER_SA_PASSWORD};TrustServerCertificate=True;Command Timeout=300"
      AllowedOrigins__0: "https://style-nest.prakashsoftwares.com"
      AllowedOrigins__1: "http://style-nest.prakashsoftwares.com"
      AllowedOrigins__2: "https://style-nest-api.prakashsoftwares.com"
      Jwt__PublicKeyPath: "/app/keys/public.pem"
      Jwt__Issuer: "${Jwt__Issuer:-https://stylenest-auth.local}"
      Jwt__Audience: "${Jwt__Audience:-stylenest-spa}"
    volumes:
